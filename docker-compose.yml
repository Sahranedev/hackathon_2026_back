services:
  database:
    image: postgres:16-alpine
    container_name: hackasaumon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hackasaumon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackasaumon}
      POSTGRES_DB: ${POSTGRES_DB:-hackasaumon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackasaumon} -d ${POSTGRES_DB:-hackasaumon}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
